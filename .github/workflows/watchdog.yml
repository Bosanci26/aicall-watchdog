name: AiCall Watchdog

on:
  schedule:
    - cron: '*/5 * * * *'   # la fiecare 5 minute
  workflow_dispatch:          # buton manual (tab Actions)
    inputs:
      simulate:
        description: "Test alarma: trimite o alerta FALSA pe Telegram, fara sa atinga AiCall"
        type: choice
        options: ["no", "down", "degraded"]
        default: "no"

concurrency:
  group: aicall-watchdog
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - name: Restaureaza ultima stare
        uses: actions/cache/restore@v4
        with:
          path: watchdog-state.txt
          key: watchdog-state-${{ github.run_id }}
          restore-keys: |
            watchdog-state-

      - name: Verifica AiCall
        env:
          BACKEND_URL: https://aicall-backend-1dwi.onrender.com
          FRONTEND_URL: https://aicall-frontend.vercel.app
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          RENDER_DEPLOY_HOOK: ${{ secrets.RENDER_DEPLOY_HOOK }}
          HEALTH_KEY: ${{ secrets.HEALTH_KEY }}
          TWILIO_LOW_USD: "5"        # anunta cand soldul Twilio scade sub $5
          ELEVENLABS_LOW_PCT: "10"   # anunta cand raman sub 10% caractere voce
          SIMULATE: ${{ github.event.inputs.simulate }}
        run: python check.py

      - name: Salveaza starea
        if: always()
        uses: actions/cache/save@v4
        with:
          path: watchdog-state.txt
          key: watchdog-state-${{ github.run_id }}

      # PLASA DE SIGURANTA. Pe 6 august, verificarea a picat inainte sa apuce
      # sa ruleze - GitHub n-a putut aduce uneltele ("Service Unavailable") -
      # deci check.py n-a pornit deloc si n-a avut cine sa dea alerta. Lucian a
      # aflat dintr-un email de la GitHub, desi ceruse pe Telegram.
      #
      # Pasul asta ruleaza cand ceva a picat si spune chiar el, pe Telegram.
      # Aici NU folosim unelte de-ale altora, doar curl: daca tocmai uneltele
      # sunt problema, o unealta in plus ar pica la fel.
      # `failure()` singur NU prinde anularile. Pe 6 august, in pana lor de
      # Actions, rularile stateau in coada si erau ANULATE - nu picate - deci
      # pasul asta nici nu se atingea. Cu `cancelled()` alaturi, se atinge.
      #
      # SLABICIUNEA CARE RAMANE, scrisa ca sa n-o uit: daca GitHub nu apuca sa
      # PORNEASCA deloc treaba, niciun pas dinauntru nu ruleaza - nici asta.
      # Un paznic care traieste in casa nu poate striga ca a ars casa. Pentru
      # asta trebuie ceva din AFARA GitHub, care sa observe ca asistentul n-a
      # mai dat semne de viata. De facut.
      - name: Spune pe Telegram ca a picat
        if: failure() || cancelled()
        run: |
          curl -s -X POST \
            "https://api.telegram.org/bot${{ secrets.TELEGRAM_BOT_TOKEN }}/sendMessage" \
            -d chat_id="${{ secrets.TELEGRAM_CHAT_ID }}" \
            -d parse_mode="HTML" \
            -d text="⚠️ <b>Asistentul de monitorizare a picat</b>%0A%0ANu a apucat sa verifice SmartBiz. Cel mai des e o pana la GitHub si trece singura la rulare urmatoare (5 min).%0A%0ADaca se repeta de mai multe ori la rand, atunci e altceva.%0A%0A<a href=\"https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}\">Vezi ce s-a intamplat</a>" \
            > /dev/null || true
