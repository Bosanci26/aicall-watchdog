name: Probele automate SmartBiz (fulger la 3h + bateria zilnica)

# v2, 22 aug 2026 - Lucian: "e cam mult odata la 5h si face cam putine la ce
# potential are". Regandit pe modelul paznic + inspectie:
#   FULGER (la 3 ore): un apel scurt de proba (scenariul transport, conditia
#     prin rotatie). Prinde repede orice stricaciune. Pe Telegram scrie DOAR
#     daca e ceva in neregula (replici pierdute / nota cazuta / server bolnav).
#   BATERIA (o data pe zi, 04:19 ora RO): TOATE scenariile si conditiile,
#     cap-coada, cu raport complet pe Telegram - tabelul zilei, cu trend.
# Costul estimat: ~1,5-2 $/zi in faza de reparatii; se rareste dupa lansare.

on:
  schedule:
    # Cronul BATERIEI s-a mutat in .github/workflows/bateria.yml (27 aug):
    # aici se transforma tacut in fulger cand GitHub intarzia pornirea.
    - cron: '19 6,14,22 * * *'   # la 8 ore - FULGER (rarit 22 aug, cerut de Lucian)
  workflow_dispatch:
    inputs:
      mod:
        description: "fulger sau baterie"
        type: choice
        options: ["fulger", "baterie"]
        default: "baterie"

concurrency:
  group: proba-smartbiz
  cancel-in-progress: false

jobs:
  proba:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    permissions:
      contents: write        # ca sa poata scrie randul in registru.jsonl
    steps:
      - uses: actions/checkout@v4
      - name: Ruleaza si raporteaza
        env:
          HEALTH_KEY: ${{ secrets.HEALTH_KEY }}
          TG_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TG_CHAT: ${{ secrets.TELEGRAM_CHAT_ID }}
          BACKEND: https://aicall-backend-1dwi.onrender.com
          MOD_MANUAL: ${{ inputs.mod }}
          # Cronul de noapte (01:19 UTC) e bateria; restul sunt fulgere.
          # github.event.schedule contine EXACT sirul cronului care a pornit
          # jobul, deci nu mai depinde de cat de tarziu il porneste GitHub.
          # Cronurile de aici sunt DOAR fulgere. Bateria vine prin
          # workflow_dispatch cu mod=baterie, din bateria.yml - deci nu mai
          # depinde de ce sir de cron raporteaza GitHub la o pornire intarziata.
          MOD_CRON: fulger
        run: |
          python3 - <<'PY'
          import json, os, re, time, urllib.request, urllib.parse, datetime

          B = os.environ["BACKEND"]; K = os.environ["HEALTH_KEY"]

          def get(url):
              with urllib.request.urlopen(url, timeout=45) as r:
                  return json.load(r)

          def post(url):
              req = urllib.request.Request(url, method="POST")
              with urllib.request.urlopen(req, timeout=45) as r:
                  return json.load(r)

          def telegram(text):
              data = urllib.parse.urlencode({
                  "chat_id": os.environ["TG_CHAT"], "text": text}).encode()
              urllib.request.urlopen(urllib.request.Request(
                  f"https://api.telegram.org/bot{os.environ['TG_TOKEN']}/sendMessage",
                  data=data), timeout=30)

          import registru   # cutia neagra (23 aug)

          # AMPRENTA: pe ce cod s-a masurat. Fara ea, doua note nu se pot
          # compara intre ele - poate ca intre timp s-a schimbat produsul.
          try:
              r0 = get(f"{B}/")
              AMPRENTA = {"cod": r0.get("code_marker")}
          except Exception:
              AMPRENTA = {"cod": None}

          RANDURI = []   # se scriu in registru.jsonl la finalul rularii


          def _fara_masuratoare(motiv: str, conditie: str = "-"):
              """
              TESTELE CARE TAC (25 august). Pana azi, cand proba nu putea rula,
              scriptul trimitea un mesaj si iesea cu cod 0: jobul aparea VERDE
              in Actions, registrul nu primea nimic, si a doua zi nu se putea
              afla ca in noaptea aia nu s-a masurat nimic. Lucian: "cand te pun
              sa testezi, vreau sa fie bine". Deci acum tacerea lasa urma: un
              rand valid=false in registru, si jobul iese ROSU.
              """
              RANDURI.append({
                  "cand": datetime.datetime.utcnow().isoformat() + "Z",
                  "scenariu": "-", "conditie": conditie, "nota": None,
                  "valid": False, "motiv": motiv,
                  "sub": {}, "masurat": {}, "judecata": {},
                  "amprenta": AMPRENTA, "stricate": [],
              })

          acum = datetime.datetime.utcnow()
          # MODUL NU SE MAI DEDUCE DIN CEAS (25 august). Bateria era programata
          # la 01:19 UTC, dar GitHub intarzie cronurile cu zeci de minute; cand
          # pornea la 02:31, `acum.hour` era 2 si bateria se transforma TACUT in
          # fulger. De aceea registrul are numai rulari "transport" (fulgere) si
          # ZERO rulari de baterie, de zile intregi, cu jobul verde in Actions.
          # Acum modul vine din cron, scris in variabila MOD_CRON.
          mod = (os.environ.get("MOD_MANUAL") or os.environ.get("MOD_CRON")
                 or "fulger").strip()
          print(f"mod: {mod}")

          # 1) serverul in picioare?
          #
          # RABDARE INAINTE DE ALARMA (28 august). Serverul reporneste de fiecare
          # data cand se pune cod nou, si repornirea tine un minut-doua. Daca proba
          # cade exact atunci, pana azi trimitea "nu ajung la server" si un email
          # rosu - pentru ceva absolut normal. Din 12 alarme de azi, 2 erau exact
          # asta. Deci incercam de 4 ori in ~3 minute; abia daca NICIUNA nu prinde
          # serverul, e cu adevarat cazut si atunci alarma e meritata.
          # ATENTIE: asta NU e o revenire la "sarim peste masuratoare in tacere" -
          # daca serverul chiar e jos, jobul tot moare rosu, ca inainte.
          h, ultima_eroare = None, None
          for incercare in range(4):
              try:
                  h = get(f"{B}/api/health/functii?key={K}")
                  break
              except Exception as e:
                  ultima_eroare = e
                  h = None
                  print(f"incercarea {incercare+1}/4 nu a prins serverul ({str(e)[:80]})")
                  if incercare < 3:
                      time.sleep(60)

          if h is None:
              print(f"NU MASOR: nu ajung la server ({str(ultima_eroare)[:120]})")
              _fara_masuratoare(f"nu ajung la server: {str(ultima_eroare)[:80]}")
              telegram(f"⚠️ Probe: nu ajung la server nici dupa 4 incercari in 3 "
                       f"minute ({str(ultima_eroare)[:70]}).")
              raise SystemExit(1)

          if h.get("verificate") != 13 or h.get("probleme"):
              print(f"NU MASOR: serverul are probleme {h.get('probleme')}")
              _fara_masuratoare(f"server bolnav: {h.get('probleme')}")
              telegram(f"⚠️ Probe: serverul are probleme {h.get('probleme')} - "
                       "asistentul de paza se ocupa.")
              raise SystemExit(1)

          # apeluri reale (pentru randul din raport)
          try:
              timpii = get(f"{B}/api/health/timpii?key={K}")
              reale = [r for r in timpii.get("replici", [])
                       if not str(r.get("pod", "")).startswith("CAproba")]
          except Exception:
              reale = []

          def ruleaza(scenariu, conditie, rabdare_start=3):
              """Porneste o proba pe server si asteapta judecata. Intoarce
              (cifre, nota_text, nota_int, trend, pierdute)."""
              for inc in range(rabdare_start):
                  try:
                      post(f"{B}/api/robot/proba-automata?key={K}"
                           f"&scenariu={scenariu}&conditie={urllib.parse.quote(conditie)}")
                      break
                  except urllib.error.HTTPError as e:
                      if e.code == 409 and inc < rabdare_start - 1:
                          time.sleep(120); continue
                      raise
              jurnal = []
              for _ in range(90):
                  time.sleep(10)
                  s = get(f"{B}/api/robot/stare-automata?key={K}")
                  jurnal = s.get("jurnal", [])
                  if not s.get("ruleaza"):
                      break
              cifre = next((l for l in jurnal if l.startswith("CIFRE:")), "CIFRE: lipsa")
              nota_l = next((l for l in jurnal if "Nota general" in l), "")
              trend = next((l for l in jurnal if l.startswith("TREND")), "")
              m = re.search(r"Nota general\S*:\s*(\d+)", nota_l)
              nota = int(m.group(1)) if m else None
              mp = re.search(r"(\d+)/(\d+) replici ajunse", cifre)
              pierdute = (int(mp.group(2)) - int(mp.group(1))) if mp else 0
              # cutia neagra: rularea asta isi scrie randul, orice ar fi iesit
              try:
                  RANDURI.append(registru.rand_din_jurnal(
                      jurnal, scenariu, conditie, AMPRENTA,
                      datetime.datetime.utcnow().isoformat() + "Z"))
              except Exception as e:
                  print(f"registru: nu am putut scrie randul ({e})")
              return cifre, nota_l, nota, trend, pierdute

          if mod == "fulger":
              CONDITII = ["curat", "telefon", "galagie"]
              conditie = CONDITII[(acum.timetuple().tm_yday * 3 + acum.hour // 8) % len(CONDITII)]
              try:
                  cifre, nota_l, nota, trend, pierdute = ruleaza("transport", conditie, rabdare_start=1)
              except Exception as e:
                  print(f"NU MASOR: proba nu a pornit ({str(e)[:120]})")
                  _fara_masuratoare(f"proba nu a pornit: {str(e)[:80]}", conditie)
                  telegram(f"⚠️ Fulger: proba nu a pornit ({str(e)[:80]})")
                  raise SystemExit(1)
              # alarma (rescrisa 23 aug - Lucian: "vreau doar cele importante").
              # Pe "galagie" robotul intra prin pod, deci FARA curatarea Krisp de
              # pe fir: replici pierdute si note de 30-45 sunt starea cunoscuta a
              # santierului, nu o stricaciune noua. Acolo tipam doar la cadere
              # fata de propriul istoric sau la eroare. Pe curat/telefon, orice
              # replica pierduta ramane semnal - acolo nu are voie sa se piarda.
              SANTIER = {"galagie"}
              rau = pierdute > 0 and conditie not in SANTIER
              if trend:
                  mt = re.search(r"data trecuta (\d+), acum (\d+)", trend)
                  if mt and int(mt.group(2)) < int(mt.group(1)) - 5:
                      rau = True
              if nota is None or any("eroare" in l for l in [cifre, nota_l]):
                  rau = True
              if rau:
                  telegram("⚡ Fulger SmartBiz (transport + " + conditie + ") - CEVA E RAU:\n"
                           + cifre + "\n" + nota_l[:300] + ("\n" + trend[:200] if trend else ""))
              # daca e bine: tacere - bateria zilnica aduce tabelul

          else:
              def _istoric_mediu(scenariu, conditie, minim=3):
                  """Media notelor de pana acum, pentru EXACT examenul asta."""
                  try:
                      note = []
                      with open("registru.jsonl", encoding="utf-8") as f:
                          for rand in f:
                              rand = rand.strip()
                              if not rand:
                                  continue
                              d = json.loads(rand)
                              if (d.get("scenariu") == scenariu
                                      and d.get("conditie") == conditie
                                      and d.get("valid") and d.get("nota")):
                                  note.append(int(d["nota"]))
                      if len(note) < minim:
                          return None
                      note = note[-10:]
                      return round(sum(note) / len(note))
                  except Exception:
                      return None

              BATERIA = [("lung", "curat"), ("clauze", "curat"), ("lung", "galagie"),
                         ("clauze", "telefon"), ("lung", "toate")]
              linii = ["🔋 Bateria zilnica SmartBiz — toate probele:"]
              for scenariu, conditie in BATERIA:
                  try:
                      cifre, nota_l, nota, trend, pierdute = ruleaza(scenariu, conditie)
                      m = re.search(r"Nota general\S*:\s*(\d+)/100", nota_l)
                      pe_scurt = m.group(1) if m else "?"
                      extra = f" (pierdute {pierdute})" if pierdute else ""
                      tr = ""
                      if trend:
                          mt = re.search(r"data trecuta (\d+)", trend)
                          if mt: tr = f" | data trecuta {mt.group(1)}"
                      # FIECARE EXAMEN SE COMPARA CU EL INSUSI, nu cu un prag comun.
                      # Pragul de 85 fusese pus dupa scenariul scurt si aplicat
                      # peste toate - dar `lung+curat` n-a trecut de 85 NICIODATA
                      # (cel mai bun: 87, o singura data), iar `clauze+curat`
                      # niciodata peste 78. Adica alarma era rosie in fiecare zi
                      # din constructie, si nu spunea nimic.
                      obisnuit = _istoric_mediu(scenariu, conditie)
                      semn = ""
                      if obisnuit and pe_scurt != "?":
                          d = int(pe_scurt) - obisnuit
                          if d <= -8:   semn = f" ⚠️ sub obisnuit ({obisnuit})"
                          elif d >= 8:  semn = f" ✅ peste obisnuit ({obisnuit})"
                          else:         semn = f" (obisnuit {obisnuit})"
                      linii.append(f"• {scenariu}+{conditie}: {pe_scurt}/100{extra}{tr}{semn}")
                  except Exception as e:
                      linii.append(f"• {scenariu}+{conditie}: EROARE {str(e)[:50]}")
              linii.append("Fiecare examen e comparat cu media LUI din trecut, "
                           "nu cu un prag comun.")
              if reale:
                  tot = sorted(r["total_gura_ureche_ms"] for r in reale
                               if r.get("total_gura_ureche_ms"))
                  if tot:
                      linii.append(f"📞 Apeluri reale: {len(reale)} replici, "
                                   f"median {tot[len(tot)//2]} ms")
              telegram("\n".join(linii))

          # ---- cutia neagra: randurile pe disc, indiferent de mod ----
          if RANDURI:
              with open("registru.jsonl", "a", encoding="utf-8") as f:
                  for r in RANDURI:
                      f.write(json.dumps(r, ensure_ascii=False) + "\n")
              print(f"registru: {len(RANDURI)} rand(uri) scrise")
          PY

      - name: Pastreaza randurile in registru
        if: always()
        run: |
          if [ -n "$(git status --porcelain registru.jsonl)" ]; then
            git config user.name "asistentul de probe"
            git config user.email "actions@github.com"
            git add registru.jsonl
            git commit -q -m "registru: rulare $(date -u +%Y-%m-%dT%H:%MZ)"
            # cineva poate fi scris intre timp: luam ce e nou si punem randul peste
            git pull --rebase -q origin master || true
            git push -q origin HEAD:master
            echo "randurile sunt in registru"
          else
            echo "nimic de scris"
          fi
