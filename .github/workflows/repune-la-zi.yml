name: Repune serverul la zi

# Pornit cu mana (sau de asistent) cand se vede ca ultimul push NU a ajuns pe
# server - adica reparatii comise si trimise, dar codul viu e tot cel vechi.
# Foloseste acelasi carlig de deploy pe care il apasa si paza cand serverul
# cade, deci nu ghiceste nimic: cheia sta in secretele repo-ului.
#
# ATENTIE: repornirea taie apelurile aflate in desfasurare. De aceea pasul
# intai intreaba serverul daca vorbeste cineva chiar acum si se opreste daca da.

on:
  workflow_dispatch:
    inputs:
      motiv:
        description: "de ce se repune la zi"
        required: false
        default: "push care nu a ajuns pe server"

jobs:
  repune:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Nu deranja un apel in curs
        env:
          HEALTH_KEY: ${{ secrets.HEALTH_KEY }}
        run: |
          python3 - <<'PY'
          import json, os, sys, urllib.request
          B = "https://aicall-backend-1dwi.onrender.com"
          try:
              with urllib.request.urlopen(
                      f"{B}/api/health/timpii?key={os.environ['HEALTH_KEY']}", timeout=45) as r:
                  d = json.load(r)
          except Exception as e:
              print(f"nu ajung la server ({e}) - probabil chiar de asta repunem"); sys.exit(0)
          reale = [x for x in d.get("replici", [])
                   if not str(x.get("pod", "")).startswith("CAproba")]
          if reale:
              print(f"STOP: {len(reale)} replici de apel real in cutia neagra - "
                    "nu repornesc peste un client care vorbeste")
              sys.exit(1)
          print("nicio replica de apel real - se poate reporni")
          PY

      - name: Porneste deployul si asteapta verdictul
        env:
          RK: ${{ secrets.RENDER_API_KEY }}
          SRV: ${{ secrets.RENDER_BACKEND_ID }}
        run: |
          # Nu mai folosim carligul vechi de deploy: pe 23 august s-a descoperit
          # ca el tintea serviciul FRONTEND (suspendat), deci auto-repararea
          # apasa degeaba de saptamani. Cu cheia de API stim si CE serviciu
          # atingem, si daca deployul a reusit sau a picat - carligul nu spune.
          python3 - <<'PY'
          import json, os, time, urllib.request
          RK, SRV = os.environ["RK"], os.environ["SRV"]
          H = {"Authorization": f"Bearer {RK}", "Content-Type": "application/json"}

          def api(cale, date=None, metoda="GET"):
              r = urllib.request.Request(f"https://api.render.com/v1{cale}",
                                         data=json.dumps(date).encode() if date else None,
                                         headers=H, method=metoda)
              with urllib.request.urlopen(r, timeout=45) as x:
                  return json.load(x)

          d = api(f"/services/{SRV}/deploys", {"clearCache": "do_not_clear"}, "POST")
          dep = d["id"]
          print(f"deploy pornit: {dep}")
          for _ in range(60):
              time.sleep(20)
              st = api(f"/services/{SRV}/deploys/{dep}")["status"]
              print(f"  {st}")
              if st == "live":
                  print("DEPLOY REUSIT - codul nou e pe server"); raise SystemExit(0)
              if st in ("update_failed", "build_failed", "canceled"):
                  print(f"DEPLOY PICAT ({st}). Cauza e in logurile Render."); raise SystemExit(1)
          print("nu s-a terminat in 20 de minute"); raise SystemExit(1)
          PY

      - name: Vezi daca a intrat codul nou
        env:
          HEALTH_KEY: ${{ secrets.HEALTH_KEY }}
        run: |
          # Semnul gratuit de repornire: jurnalul probelor sta in memoria
          # procesului, deci se GOLESTE cand serverul se ridica din nou. Daca
          # ramane la acelasi numar de randuri, deployul NU a intrat - cel mai
          # probabil a esuat, si atunci raspunsul e in emailul de la Render.
          U="https://aicall-backend-1dwi.onrender.com/api/robot/stare-automata?key=$HEALTH_KEY"
          inainte=$(curl -s --max-time 30 "$U" | python3 -c "import sys,json;print(len(json.load(sys.stdin).get('jurnal',[])))" 2>/dev/null || echo -1)
          echo "randuri in jurnal inainte: $inainte"
          for i in $(seq 1 30); do
            sleep 20
            acum=$(curl -s --max-time 30 "$U" | python3 -c "import sys,json;print(len(json.load(sys.stdin).get('jurnal',[])))" 2>/dev/null || echo -1)
            if [ "$acum" = "0" ] && [ "$inainte" != "0" ]; then
              echo "serverul s-a ridicat cu codul nou (dupa ~$((i*20))s)"; exit 0
            fi
            echo "inca nu (randuri=$acum)"
          done
          echo "ZECE MINUTE si serverul tot nu s-a repornit - deployul a ESUAT."
          echo "Raspunsul e in emailul 'deploy failed' de la Render, la View Logs."
          exit 1
